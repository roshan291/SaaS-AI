name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npx turbo run typecheck

      - name: Test (all workspaces)
        env:
          # Stub envs so any import-time validation in @saas/queue / jwt
          # does not blow up unit tests that don't actually hit the DB.
          REDIS_URL: redis://localhost:6379
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-only-jwt-secret-do-not-use-in-production-1234567890abcdefghij
          CLOUDINARY_URL: cloudinary://test:test@test
        run: npx turbo run test

      - name: Build (all workspaces)
        env:
          REDIS_URL: redis://localhost:6379
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-only-jwt-secret-do-not-use-in-production-1234567890abcdefghij
          CLOUDINARY_URL: cloudinary://test:test@test
        run: npx turbo run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
